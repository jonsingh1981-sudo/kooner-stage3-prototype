<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22144f">
<title>Kooner Van Stock</title><link rel="manifest" href="/manifest.json">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
:root{--p:#241651;--p2:#3b2a7d;--bg:#f5f4f8;--card:#fff;--line:#e5e1ed;--muted:#6f6978;--green:#14834d;--red:#c53a3a;--amber:#ae7600}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f1c26}.app{max-width:780px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));padding:16px 15px 13px}.brand{font-size:23px;font-weight:900}.brand span{font-weight:400}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.sub{font-size:12px;opacity:.92;margin-top:4px}.back{border:0;background:transparent;color:#fff;font-weight:700;padding:0}.content{padding:14px 13px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(30,20,65,.045)}.hero{background:linear-gradient(135deg,#fff,#f0ecfb)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.tiny{font-size:11px}.pill{display:inline-block;background:#eee9f8;color:var(--p);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;margin:2px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{border:0;border-radius:16px;min-height:105px;padding:14px;text-align:left;color:#fff;background:var(--p)}.action.green{background:var(--green)}.action.red{background:var(--red)}.action.amber{background:var(--amber)}.action.grey{background:#61596d}.action b{display:block;font-size:17px;margin-top:7px}.action small{display:block;margin-top:4px;opacity:.92}.ico{font-size:26px}.row{display:flex;gap:9px;align-items:center}.space{justify-content:space-between}.wrap{flex-wrap:wrap}.btn{border:0;background:var(--p);color:#fff;border-radius:11px;padding:12px 13px;font-weight:800}.btn.full{width:100%}.btn.light{background:#eeeaf6;color:var(--p)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbc5d7;border-radius:11px;background:#fff;font:inherit}.notice{background:#fff3d7;border-left:4px solid var(--amber);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}.stockrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.qty{font-weight:900;text-align:right}.nav{position:fixed;bottom:0;left:0;right:0;max-width:780px;margin:auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:6}.nav button{border:0;background:transparent;color:#6e6877;font-size:11px;padding:6px}.nav b{display:block;font-size:19px}.nav .active{color:var(--p);font-weight:900}.modal{position:fixed;inset:0;background:rgba(15,10,28,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.scanner{min-height:260px;background:#111;border-radius:14px;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(15px);background:#17131e;color:#fff;border-radius:10px;padding:10px 13px;opacity:0;transition:.2s;z-index:99;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f1eef7;border-radius:12px;padding:10px}.stat b{font-size:20px;color:var(--p);display:block}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#22144f,#4a3691)}.login .card{width:100%;max-width:460px}.logo{font-size:29px;font-weight:900;color:var(--p);margin-bottom:6px}.location{background:#e8f6ee;color:#12623d;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800}.bad{background:#fdecec;color:#9f2626}.search{position:sticky;top:84px;background:var(--card);padding-bottom:8px;z-index:3}.adminBlock{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}@media(min-width:650px){.content{padding:20px 20px 96px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
let state={user:null,locations:[],products:[],movements:[],stocktakes:[]},view='home',activeLocation=localStorage.getItem('kvs_loc')||'',scanner=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function loc(code){return state.locations.find(x=>x.code===code)}function pqty(p,c=activeLocation){return Number((p.stock||{})[c]||0)}function qtyText(p,c=activeLocation){const q=pqty(p,c);return q+' '+p.unit+(p.unit==='litre'&&q!==1?'s':'')}
async function boot(){const id=localStorage.getItem('kvs_user');if(!id)return renderLogin();try{const d=await api('/api/bootstrap?employeeId='+encodeURIComponent(id));if(!d.user){localStorage.removeItem('kvs_user');return renderLogin()}state=d;if(!activeLocation)activeLocation=d.user.assignedLocation||d.locations[0]?.code||'';localStorage.setItem('kvs_loc',activeLocation);go('home')}catch(e){renderLogin(e.message)}}
function renderLogin(msg=''){document.getElementById('root').innerHTML=`<div class="login"><div class="card"><div class="logo">KOONER <span style="font-weight:400">Van Stock</span></div><p class="muted">Live mobile prototype</p>${msg?`<div class="notice">${esc(msg)}</div>`:''}<button class="btn full" onclick="scanLogin()">📷 Scan staff ID</button><label>Or enter Employee ID</label><div class="row"><input id="loginid" value="BJS006503"><button class="btn" onclick="loginManual()">Sign in</button></div><p class="tiny muted" style="margin-top:12px">This device will remember the signed-in user until Change User is selected.</p></div></div>`}
async function loginManual(){const id=$('#loginid').value.trim();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({employeeId:id})});localStorage.setItem('kvs_user',d.user.employeeId);activeLocation=d.user.assignedLocation||'';localStorage.setItem('kvs_loc',activeLocation);await boot()}catch(e){toast(e.message)}}
function scanLogin(){openScanner('Scan staff ID',async code=>{try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({employeeId:code})});localStorage.setItem('kvs_user',d.user.employeeId);activeLocation=d.user.assignedLocation||'';localStorage.setItem('kvs_loc',activeLocation);await boot()}catch(e){toast(e.message)}})}
function head(title,back=false){const l=loc(activeLocation);return `<div class="top"><div class="toprow">${back?'<button class="back" onclick="go(\'home\')">← Home</button>':''}<div class="brand">KOONER <span>Van Stock</span></div></div><div class="sub">${esc(title)} · ${esc(state.user?.name||'')} · ${esc(l?.name||activeLocation)}</div></div>`}
function nav(){return `<div class="nav"><button class="${view==='home'?'active':''}" onclick="go('home')"><b>⌂</b>Home</button><button class="${view==='stock'?'active':''}" onclick="go('stock')"><b>▦</b>Stock</button><button class="${view==='history'?'active':''}" onclick="go('history')"><b>↺</b>History</button><button class="${view==='admin'?'active':''}" onclick="go('admin')"><b>⚙</b>Admin</button></div>`}
function go(v,arg=''){stopScanner();view=v;document.getElementById('root').innerHTML=`<div class="app">${render(v,arg)}${nav()}</div>`}
function render(v,arg){return ({home,stock,move,transfer,stocktake,findpart,history,admin,locationqr}[v]||home)(arg)}
function home(){const lines=state.products.filter(p=>pqty(p)>0).length,total=state.products.reduce((a,p)=>a+pqty(p),0);return `${head('Live shared stock')}<div class="content"><div class="card hero"><h1>Welcome, ${esc(state.user.name.split(' ')[0])}</h1><div class="location">Active location: ${esc(loc(activeLocation)?.name||activeLocation)}</div><p class="muted">Stock movements are shared live across devices using the same system.</p></div><div class="card statgrid"><div class="stat"><b>${lines}</b><span class="tiny">stock lines</span></div><div class="stat"><b>${total}</b><span class="tiny">units/litres</span></div><div class="stat"><b>${state.movements.length}</b><span class="tiny">recent moves</span></div></div><div class="grid"><button class="action green" onclick="go('move','IN')"><span class="ico">📦</span><b>Stock In</b><small>Add to location</small></button><button class="action red" onclick="go('move','OUT')"><span class="ico">📤</span><b>Stock Out</b><small>Use/remove stock</small></button><button class="action grey" onclick="go('transfer')"><span class="ico">🔄</span><b>Transfer</b><small>Move between locations</small></button><button class="action amber" onclick="go('stocktake')"><span class="ico">🧮</span><b>Stocktake</b><small>Count & reconcile</small></button><button class="action" onclick="go('findpart')"><span class="ico">🔎</span><b>Find a Part</b><small>Search all locations</small></button><button class="action grey" onclick="scanLocation()"><span class="ico">▣</span><b>Scan Location</b><small>Van / stores QR</small></button></div><div class="card" style="margin-top:12px"><div class="row space"><div><div class="name">${esc(state.user.name)}</div><div class="meta">${esc(state.user.employeeId)} · ${esc(state.user.role)}</div></div><button class="btn light" onclick="changeUser()">Change user</button></div></div></div>`}
function stock(){return `${head('Stock at '+(loc(activeLocation)?.name||activeLocation),true)}<div class="content"><div class="card"><div class="search"><input id="sq" placeholder="Search description, manufacturer or part no." oninput="stockFilter(this.value)"></div><div id="stockrows">${state.products.map(stockRow).join('')}</div></div></div>`}
function stockRow(p){return `<div class="stockrow" data-search="${esc((p.name+' '+p.partNo+' '+p.manufacturer).toLowerCase())}"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.manufacturer||'Manufacturer not set')}${p.partNo?' · '+esc(p.partNo):''}</div></div><div class="qty">${esc(qtyText(p))}</div></div>`}function stockFilter(q){document.querySelectorAll('#stockrows .stockrow').forEach(x=>x.style.display=x.dataset.search.includes(q.toLowerCase())?'grid':'none')}
function productOptions(){return [...state.products].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}${p.partNo?' · '+esc(p.partNo):''} (${esc(qtyText(p))})</option>`).join('')}
function move(type){const inn=type==='IN';return `${head(inn?'Stock In':'Stock Out',true)}<div class="content"><div class="card"><div class="notice">${inn?'Add stock into':'Remove stock from'} <b>${esc(loc(activeLocation)?.name||activeLocation)}</b>.</div><button class="btn full" onclick="scanProduct()">📷 Scan product barcode</button><label>Or select item</label><select id="product">${productOptions()}</select><label>Quantity</label><input id="qty" type="number" value="1" min="0.01" step="0.01">${inn?'':`<label>Reason</label><select id="reason"><option>Job</option><option>Transfer</option><option>Damaged</option><option>Return</option><option>Adjustment</option></select><label>Vehicle reg / job reference (optional)</label><input id="ref" placeholder="e.g. WX26ABC / WO-1234">`}<button class="btn full ${inn?'green':'red'}" style="margin-top:13px" onclick="doMove('${type}')">Confirm ${inn?'Stock In':'Stock Out'}</button></div></div>`}
async function doMove(type){const p=$('#product').value,q=Number($('#qty').value),body={employeeId:state.user.employeeId,type,productId:p,qty:q,fromLocation:type==='OUT'?activeLocation:null,toLocation:type==='IN'?activeLocation:null,reason:type==='OUT'?$('#reason').value:'Replenishment',reference:type==='OUT'?$('#ref').value:''};try{await api('/api/movements',{method:'POST',body:JSON.stringify(body)});toast('Movement recorded');await refresh();go('stock')}catch(e){toast(e.message)}}
function transfer(){return `${head('Transfer stock',true)}<div class="content"><div class="card"><label>From</label><select id="from">${locationOptions(activeLocation)}</select><label>To</label><select id="to">${locationOptions(state.locations.find(l=>l.code!==activeLocation)?.code||'')}</select><button class="btn light full" style="margin-top:8px" onclick="scanLocationFor('from')">Scan FROM location</button><button class="btn light full" style="margin-top:8px" onclick="scanLocationFor('to')">Scan TO location</button><label>Product</label><select id="product">${productOptions()}</select><label>Quantity</label><input id="qty" type="number" min="0.01" step="0.01" value="1"><label>Reference (optional)</label><input id="ref" placeholder="Reason / job"><button class="btn full" style="margin-top:13px" onclick="doTransfer()">Confirm transfer</button></div></div>`}
function locationOptions(sel=''){return state.locations.map(l=>`<option value="${esc(l.code)}" ${l.code===sel?'selected':''}>${esc(l.name)}</option>`).join('')}async function doTransfer(){const from=$('#from').value,to=$('#to').value;if(from===to)return toast('From and To must be different');try{await api('/api/movements',{method:'POST',body:JSON.stringify({employeeId:state.user.employeeId,type:'TRANSFER',productId:$('#product').value,qty:Number($('#qty').value),fromLocation:from,toLocation:to,reason:'Transfer',reference:$('#ref').value})});toast('Transfer recorded');await refresh();go('stock')}catch(e){toast(e.message)}}
function stocktake(){return `${head('Stocktake',true)}<div class="content"><div class="notice">Count the physical stock at <b>${esc(loc(activeLocation)?.name||activeLocation)}</b>. Only differences create an adjustment.</div><div class="card">${state.products.map(p=>`<div class="stockrow"><div><div class="name">${esc(p.name)}</div><div class="meta">System: ${esc(qtyText(p))}</div></div><input data-count="${p.id}" style="width:88px" type="number" step="0.01" min="0" value="${pqty(p)}"></div>`).join('')}<button class="btn full" onclick="finishStocktake()">Finish stocktake</button></div></div>`}async function finishStocktake(){const counts=[...document.querySelectorAll('[data-count]')].map(i=>({productId:i.dataset.count,actualQty:Number(i.value)}));try{const r=await api('/api/stocktake',{method:'POST',body:JSON.stringify({employeeId:state.user.employeeId,locationCode:activeLocation,counts})});toast('Stocktake saved · '+r.variances.length+' variance(s)');await refresh();go('history')}catch(e){toast(e.message)}}
function findpart(){return `${head('Find a part',true)}<div class="content"><div class="card"><input placeholder="Part number, description or manufacturer" oninput="findNow(this.value)"><div id="findout" style="margin-top:12px" class="muted">Start typing to search.</div></div></div>`}function findNow(q){const out=$('#findout');if(q.trim().length<2){out.innerHTML='Start typing to search.';return}const m=state.products.filter(p=>(p.name+' '+p.partNo+' '+p.manufacturer).toLowerCase().includes(q.toLowerCase()));out.innerHTML=m.length?m.map(p=>`<div class="card"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.manufacturer||'')}${p.partNo?' · '+esc(p.partNo):''}</div><p>${state.locations.map(l=>`<span class="pill">${esc(l.name)}: ${esc(qtyText(p,l.code))}</span>`).join('')}</p></div>`).join(''):'<div class="notice">No matching product.</div>'}
function history(){return `${head('Movement history',true)}<div class="content"><div class="card">${state.movements.length?`<table class="table"><thead><tr><th>When</th><th>Movement</th><th>Item</th><th>Qty</th></tr></thead><tbody>${state.movements.map(m=>`<tr><td>${new Date(m.when).toLocaleString('en-GB')}</td><td><b>${esc(m.type)}</b><div class="meta">${esc(m.user)}<br>${esc(m.reason||'')} ${esc(m.reference||'')}</div></td><td>${esc(m.product)}${m.partNo?'<div class="meta">'+esc(m.partNo)+'</div>':''}</td><td>${esc(m.qty)} ${esc(m.unit)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No movements yet.</div>'}</div></div>`}
function admin(){return `${head('Admin',true)}<div class="content"><div class="card"><h3>Test setup</h3><p><span class="pill">${esc(state.user.name)} · ${esc(state.user.employeeId)}</span><span class="pill">${esc(loc(activeLocation)?.name||activeLocation)}</span></p><button class="btn light full" onclick="go('locationqr')">Show / print current location QR</button></div><div class="card"><h3>Add technician</h3><label>Employee ID</label><input id="uId"><label>Name</label><input id="uName"><label>Role</label><input id="uRole" value="Technician"><label>Allocated van/location</label><select id="uLoc"><option value="">None</option>${locationOptions()}</select><button class="btn full" style="margin-top:12px" onclick="addUser()">Add technician</button></div><div class="card"><h3>Add van/location</h3><label>Van registration / location code</label><input id="lCode"><label>Location name</label><input id="lName" placeholder="e.g. Van - AB12CDE"><label>Type</label><select id="lType"><option value="van">Van</option><option value="stores">Stores</option></select><button class="btn full" style="margin-top:12px" onclick="addLocation()">Add location</button></div><div class="card"><h3>Add product</h3><button class="btn full" onclick="newProduct('')">+ Create product</button><p class="tiny muted" style="margin-top:10px">Minimum / target stock is deliberately left for the later stage as agreed.</p></div><div class="card"><h3>Prototype control</h3><p class="tiny muted">Reset reloads Jon, AB26CDE and your original van stock list.</p><button class="btn red full" onclick="resetAll()">Reset V2 test data</button></div></div>`}
async function addUser(){try{await api('/api/users',{method:'POST',body:JSON.stringify({employeeId:$('#uId').value,name:$('#uName').value,role:$('#uRole').value,assignedLocation:$('#uLoc').value})});toast('Technician added');await refresh();go('admin')}catch(e){toast(e.message)}}async function addLocation(){const code=$('#lCode').value.trim();try{await api('/api/locations',{method:'POST',body:JSON.stringify({code,name:$('#lName').value||('Van - '+code),type:$('#lType').value,vehicleReg:$('#lType').value==='van'?code:''})});toast('Location added');await refresh();go('admin')}catch(e){toast(e.message)}}
function locationqr(){const payload=(loc(activeLocation)?.type==='van'?'VAN:':'LOC:')+activeLocation;setTimeout(()=>QRcodeDraw(payload),80);return `${head('Location QR',true)}<div class="content"><div class="card" style="text-align:center"><h2>${esc(loc(activeLocation)?.name||activeLocation)}</h2><canvas id="qrcanvas" style="max-width:280px;width:82%"></canvas><p><b>${esc(payload)}</b></p><p class="tiny muted">Print this as a durable label and fix it inside the van/location.</p></div></div>`}function QRcodeDraw(text){if(window.QRCode&&$('#qrcanvas'))QRCode.toCanvas($('#qrcanvas'),text,{width:300,margin:2},()=>{})}
function scanLocation(){openScanner('Scan van / location QR',code=>setLocationFromCode(code))}function scanLocationFor(id){openScanner('Scan location QR',code=>{const c=parseLocationCode(code);if(!findLocation(c))return toast('Unknown location');$('#'+id).value=c;toast(findLocation(c).name)})}function parseLocationCode(code){return String(code).replace(/^VAN:/i,'').replace(/^LOC:/i,'').trim().toUpperCase()}function findLocation(c){return state.locations.find(l=>l.code.toUpperCase()===String(c).toUpperCase())}function setLocationFromCode(code){const c=parseLocationCode(code),l=findLocation(c);if(!l)return toast('Location not registered');activeLocation=l.code;localStorage.setItem('kvs_loc',activeLocation);toast('Location changed to '+l.name);go('home')}
function scanProduct(){openScanner('Scan product barcode',code=>{const p=state.products.find(x=>x.barcode===code||norm(x.partNo)===norm(code));if(p){$('#product').value=p.id;toast(p.name+' selected')}else newProduct(code)})}function norm(s){return String(s||'').replace(/\s|\.|\//g,'').toLowerCase()}
function openScanner(title,done){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><div class="row space"><h2>${esc(title)}</h2><button class="btn light" id="close">Close</button></div><div id="reader" class="scanner">Starting camera…</div><label>Manual value (testing)</label><div class="row"><input id="manual"><button class="btn" id="use">Use</button></div></div>`;document.body.appendChild(m);m.querySelector('#close').onclick=()=>{stopScanner();m.remove()};m.querySelector('#use').onclick=()=>{const v=m.querySelector('#manual').value.trim();if(v){stopScanner();m.remove();done(v)}};if(window.Html5Qrcode){m.querySelector('#reader').innerHTML='';scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:180}},code=>{stopScanner();m.remove();done(code)},()=>{}).catch(()=>m.querySelector('#reader').innerHTML='Camera unavailable. Use the manual field.')}else m.querySelector('#reader').innerHTML='Scanner unavailable. Use the manual field.'}
function stopScanner(){if(scanner){try{scanner.stop().catch(()=>{})}catch(e){}scanner=null}}
function newProduct(barcode){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><div class="row space"><h2>New product</h2><button class="btn light" onclick="this.closest('.modal').remove()">Close</button></div>${barcode?`<div class="notice">Unknown barcode: <b>${esc(barcode)}</b></div>`:''}<label>Description</label><input id="nName"><label>Category</label><input id="nCat" placeholder="e.g. Brake Pads"><label>Manufacturer</label><input id="nMan"><label>Part number</label><input id="nPart"><label>Unit</label><select id="nUnit"><option>each</option><option>set</option><option>litre</option></select><label>Vehicle applications (optional)</label><input id="nApp" placeholder="e.g. Renault Master, Nissan Interstar"><button class="btn full" style="margin-top:12px" id="saveNew">Save product</button></div>`;document.body.appendChild(m);m.querySelector('#saveNew').onclick=async()=>{try{await api('/api/products',{method:'POST',body:JSON.stringify({name:m.querySelector('#nName').value,category:m.querySelector('#nCat').value,manufacturer:m.querySelector('#nMan').value,partNo:m.querySelector('#nPart').value,barcode,unit:m.querySelector('#nUnit').value,applications:m.querySelector('#nApp').value.split(',').map(x=>x.trim()).filter(Boolean)})});m.remove();toast('Product created');await refresh();if(view==='admin')go('admin')}catch(e){toast(e.message)}}}
function changeUser(){localStorage.removeItem('kvs_user');state.user=null;renderLogin()}async function resetAll(){if(!confirm('Reset all V2 test stock and movements?'))return;await api('/api/reset',{method:'POST',body:'{}'});toast('Test data reset');await refresh();go('home')}async function refresh(){const id=localStorage.getItem('kvs_user');state=await api('/api/bootstrap?employeeId='+encodeURIComponent(id))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});boot();
</script></body></html>
